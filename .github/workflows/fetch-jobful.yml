name: Fetch Jobs — Jobful (Rotating Days)

on:
  schedule:
    # 12:01 AM IST = 18:31 UTC of previous day. Runs on rotating days (Group 4).
    - cron: '31 18 4,8,12,16,20,24,28 * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fetcher repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Jobful fetcher
        run: node jobful-fetcher/run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Report status
        if: always()
        run: echo "Jobful sync completed at $(date -u)"
