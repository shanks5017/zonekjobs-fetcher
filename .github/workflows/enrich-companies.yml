name: Enrich Companies Details (Every 2 Days)

on:
  schedule:
    # 12:05 AM IST = 18:35 UTC of previous day. Runs once every 2 days.
    - cron: '35 18 */2 * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout fetcher repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Note: No Playwright browsers required!
      # The company enricher uses direct HTTP fetch APIs, keeping execution fast (<2 mins).
      - name: Run Company Details Enricher
        run: node company-enricher/run.mjs --limit 150
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLEARBIT_API_KEY: ${{ secrets.CLEARBIT_API_KEY }} # Optional, works fine if empty
