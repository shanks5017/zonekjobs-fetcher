name: Fetch Jobs — OpenJobs (Rotating Days)

on:
  schedule:
    # 12:01 AM IST = 18:31 UTC of previous day. Runs on rotating days (Group 2).
    - cron: '31 18 2,6,10,14,18,22,26,30 * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fetcher repo
        uses: actions/checkout@v4

      - name: Clone OpenJobs company dataset
        run: |
          git clone --depth 1 \
            https://github.com/outscal/OpenJobs.git \
            openjobs-repo

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run OpenJobs fetcher
        run: node openjobs/run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Report status
        if: always()
        run: echo "OpenJobs sync completed at $(date -u)"
