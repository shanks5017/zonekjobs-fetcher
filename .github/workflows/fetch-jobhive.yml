name: Fetch Jobs — Jobhive (Rotating Days)

on:
  schedule:
    # 12:01 AM IST = 18:31 UTC of previous day. Runs on rotating days (Group 1).
    - cron: '31 18 1,5,9,13,17,21,25,29 * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        ats: [ashby, avature, bamboohr, breezy, cornerstone, eightfold, gem, greenhouse, icims, jazzhr, join_com, lever, mercor, oracle, personio, phenom, pinpoint, recruitee, recruiterbox, rippling, smartrecruiters, successfactors, taleo, teamtailor, workable, workday]

    steps:
      - name: Checkout fetcher repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install

      - name: Clone ats-scrapers (Jobhive)
        run: git clone --depth=1 https://github.com/kalil0321/ats-scrapers.git ../ats-scrapers

      - name: Install Jobhive and dependencies
        run: |
          cd ../ats-scrapers
          python -m pip install --upgrade pip
          pip install -e ".[scrapers,parquet]"

      - name: Run Jobhive Full Fetcher (${{ matrix.ats }})
        run: node jobhive-fetcher/run-full.mjs --ats ${{ matrix.ats }} --concurrency 8
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Report status
        if: always()
        run: echo "Jobhive sync for ${{ matrix.ats }} completed at $(date -u)"
